name: homework5 CI

on:
  push:
    paths:
      - 'homework5/**'
      - '.github/workflows/homework5.yml'
  pull_request:
    paths:
      - 'homework5/**'
      - '.github/workflows/homework5.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: homework5

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/PromoCodeFactory.slnx

      - name: Build
        run: dotnet build src/PromoCodeFactory.slnx -c Release --no-restore

      - name: Test
        run: dotnet test src/PromoCodeFactory.slnx -c Release --no-build --verbosity normal

  docker:
    name: Docker compose smoke test
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build and start containers
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Check API (migrations applied, seed loaded)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8091/api/v1/roles; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Container logs
        if: always()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v
