services:
  promocode-factory-db:
    image: postgres:17-alpine
    container_name: promocode-factory-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: promocode_factory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d promocode_factory"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  promocode-factory-api:
    build:
      context: .
      dockerfile: src/Dockerfile
    image: promocode-factory-api
    container_name: promocode-factory-api
    ports:
      - "8091:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PromocodeFactoryDb: Host=promocode-factory-db;Port=5432;Database=promocode_factory;Username=postgres;Password=postgres
    depends_on:
      promocode-factory-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
